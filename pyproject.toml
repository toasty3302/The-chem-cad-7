[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemcad-mcp"
version = "0.1.0"
description = "Local MCP bridge for CHEMCAD's Windows COM automation interface"
requires-python = ">=3.11"
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = [
    "mcp>=1.26,<2",
    "pywin32>=311; sys_platform == 'win32'",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pefile>=2024.8.26", "ruff>=0.15"]

[project.scripts]
chemcad-mcp = "chemcad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemcad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["work", ".firecrawl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
